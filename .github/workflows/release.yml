name: Release

# A v1.2.3 tag builds both apps and publishes a GitHub release.
# Running it by hand builds the same artifacts without releasing, to check a build before tagging.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SDK_VERSION: 10.0.401
  # Pinned together: workload set 10.0.402 moves Mac Catalyst to Xcode 27, which hosted runners only offer in preview.
  DOTNET_WORKLOAD_VERSION: 10.0.401
  XCODE_VERSION: '26.6'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      label: ${{ steps.version.outputs.label }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            label="$version"
          else
            version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)
            label="$version-${GITHUB_SHA::7}"
          fi
          # macOS bundle versions accept dotted integers only, so suffixes such as -beta cannot ship.
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '$version' must look like 1.2.3"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "label=$label" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Test
        run: dotnet test tests/ClearTextAI.Core.Tests/ClearTextAI.Core.Tests.csproj -c Release

  windows:
    name: Windows
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.test.outputs.version }}
      LABEL: ${{ needs.test.outputs.label }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Install MAUI workload
        run: dotnet workload install maui-windows --version "$DOTNET_WORKLOAD_VERSION"

      # One self contained exe that runs on a clean PC without the .NET or Windows App SDK runtimes.
      # WinUI expects resources.pri and its native libraries beside the app, so everything unpacks
      # together on first launch. The smoke test below catches a .NET release that drops this mode.
      - name: Publish
        run: |
          dotnet publish src/ClearTextAI.App/ClearTextAI.App.csproj \
            -c Release -f net10.0-windows10.0.19041.0 -r win-x64 --self-contained \
            -p:WindowsAppSDKSelfContained=true \
            -p:PublishSingleFile=true \
            -p:IncludeAllContentForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:DebugType=none \
            -p:Version="$VERSION" \
            -p:ApplicationDisplayVersion="$VERSION" \
            -p:ApplicationVersion=${{ github.run_number }} \
            -o publish
          if [[ "$(ls publish)" != "ClearTextAI.exe" ]]; then
            echo "::error::Expected publish to contain only ClearTextAI.exe, found: $(ls publish | tr '\n' ' ')"
            exit 1
          fi

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path publish/ClearTextAI.exe -DestinationPath "ClearTextAI-$env:LABEL-windows-x64.zip"

      - name: Smoke test
        shell: pwsh
        run: |
          Expand-Archive "ClearTextAI-$env:LABEL-windows-x64.zip" smoke
          $app = Start-Process (Resolve-Path smoke/ClearTextAI.exe) -PassThru
          $deadline = (Get-Date).AddMinutes(2)
          while (-not $app.HasExited -and $app.MainWindowHandle -eq 0 -and (Get-Date) -lt $deadline) {
            Start-Sleep -Milliseconds 500
            $app.Refresh()
          }
          # A broken package tends to show its window and then crash, so it has to survive a little longer.
          Start-Sleep -Seconds 5
          $app.Refresh()
          if ($app.HasExited) { throw "ClearText AI exited during startup with code $($app.ExitCode)" }
          if ($app.MainWindowHandle -eq 0) { throw "ClearText AI did not open its window" }
          Stop-Process -Id $app.Id

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: ClearTextAI-*-windows-x64.zip
          if-no-files-found: error

  macos:
    name: macOS
    needs: test
    runs-on: macos-26
    env:
      VERSION: ${{ needs.test.outputs.version }}
      LABEL: ${{ needs.test.outputs.label }}
      # Named after ApplicationTitle; the universal bundle sits above the per architecture builds.
      APP: src/ClearTextAI.App/bin/Release/net10.0-maccatalyst/ClearText AI.app
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select --switch "/Applications/Xcode_$XCODE_VERSION.app"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Install MAUI workload
        run: dotnet workload install maui-maccatalyst --version "$DOTNET_WORKLOAD_VERSION"

      # Ad hoc signed: Apple silicon reports an unsigned bundle as damaged, an ad hoc one only as unverified.
      - name: Publish
        run: >
          dotnet publish src/ClearTextAI.App/ClearTextAI.App.csproj
          -c Release -f net10.0-maccatalyst
          -p:CreatePackage=false
          -p:EnableCodeSigning=true
          -p:CodesignKey=-
          -p:Version="$VERSION"
          -p:ApplicationDisplayVersion="$VERSION"
          -p:ApplicationVersion=${{ github.run_number }}

      - name: Verify bundle
        run: |
          plist="$APP/Contents/Info.plist"
          codesign --verify --deep --strict --verbose=2 "$APP"
          lipo "$APP/Contents/MacOS/$(plutil -extract CFBundleExecutable raw "$plist")" -verify_arch arm64 x86_64
          plutil -extract CFBundleShortVersionString raw "$plist" | grep -qx "$VERSION"

      - name: Package
        run: |
          mkdir dmg
          ditto "$APP" "dmg/$(basename "$APP")"
          ln -s /Applications dmg/Applications
          # hdiutil intermittently fails with "Resource busy" on hosted runners.
          for attempt in 1 2 3; do
            hdiutil create -volname "ClearText AI" -srcfolder dmg -format UDZO -ov "ClearTextAI-$LABEL-macos.dmg" && exit 0
            sleep 10
          done
          exit 1

      - name: Smoke test
        run: |
          exe=$(plutil -extract CFBundleExecutable raw "$APP/Contents/Info.plist")
          open "$APP"
          for _ in $(seq 60); do pgrep -x "$exe" > /dev/null && break; sleep 1; done
          # A broken bundle tends to launch and then crash, so it has to survive a little longer.
          sleep 10
          if ! pgrep -x "$exe" > /dev/null; then
            echo "::error::ClearText AI is not running ten seconds after launch"
            exit 1
          fi
          pkill -x "$exe"

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: ClearTextAI-*-macos.dmg
          if-no-files-found: error

  release:
    name: Release
    needs: [test, windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.test.outputs.version }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --title "ClearText AI $VERSION"
          --notes-file .github/release-notes.md
          --generate-notes
